<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Elegy — Card Manifest</title>
    <!-- Polices pour le drawer -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Imperial Elegy</h1>
        <p>Card Manifest</p>
    </header>

    <div class="controls">
        <div class="search-group">
            <label for="filter-name">Search Title</label>
            <input type="text" id="filter-name" placeholder="Card name...">
        </div>
        <div class="search-group">
            <label for="filter-text">Search Text</label>
            <input type="text" id="filter-text" placeholder="Card text...">
        </div>
        <div class="search-group">
            <label for="filter-type">Type</label>
            <select id="filter-type">
                <option value="">All Types</option>
                <option value="Event" selected>Event (all)</option>
                <option value="Event-mandatory">Event — Mandatory</option>
                <option value="Event-response">Event — Response</option>
                <option value="Event-combat">Event — Combat</option>
                <option value="GW Event">GW Event</option>
                <option value="Home">Home</option>
                <option value="GE Objective">GE Objective</option>
                <option value="UK Objective">UK Objective</option>
                <option value="FR Objective">FR Objective</option>
                <option value="AU Objective">AU Objective</option>
                <option value="RU Objective">RU Objective</option>
                <option value="OT Objective">OT Objective</option>
            </select>
        </div>
        <div class="search-group">
            <label for="per-page">Per Page</label>
            <select id="per-page">
                <option value="25">25</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="999">All</option>
            </select>
        </div>
        <div class="view-toggle">
            <button id="btn-table" class="active" onclick="setView('table')">Table</button>
            <button id="btn-gallery" onclick="setView('gallery')">Gallery</button>
        </div>
    </div>

    <div class="results-info" id="results-info"></div>

    <div class="table-container active" id="table-view">
        <table>
            <thead>
                <tr>
                    <th data-sort="number"># <span class="sort-arrow">▲</span></th>
                    <th data-sort="cp">CP <span class="sort-arrow">▲</span></th>
                    <th data-sort="name">Name <span class="sort-arrow">▲</span></th>
                    <th data-sort="type">Type <span class="sort-arrow">▲</span></th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="gallery-container" id="gallery-view">
        <div class="gallery-grid" id="gallery-grid"></div>
    </div>

    <div class="pagination" id="pagination"></div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <button class="lightbox-nav prev" onclick="navLightbox(-1)">‹</button>
        <button class="lightbox-nav next" onclick="navLightbox(1)">›</button>
        <div class="lightbox-content">
            <img id="lb-img" src="" alt="">
            <div class="lightbox-details">
                <h2 id="lb-name"></h2>
                <div class="detail-row">
                    <div class="detail-label">Type</div>
                    <div class="detail-value" id="lb-type"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Number</div>
                    <div class="detail-value" id="lb-number"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Command Points</div>
                    <div class="detail-value" id="lb-cp"></div>
                </div>
                <div class="detail-row" id="lb-spec-row">
                    <div class="detail-label">Card Text</div>
                    <div class="card-text" id="lb-spec"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════
         PDF DRAWER
    ════════════════════════════════════════════ -->

    <!-- Overlay -->
    <div class="drawer-overlay" id="drawerOverlay"></div>

    <!-- Bouton déclencheur — fixe bas-gauche -->
    <button class="pdf-trigger" id="pdfTrigger" aria-label="Ouvrir le rulebook PDF">
        <svg class="trigger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Rulebook
        <div class="trigger-dot"></div>
    </button>

    <!-- Drawer -->
    <aside class="drawer" id="pdfDrawer" role="dialog" aria-modal="true" aria-label="Rulebook PDF" tabindex="-1">

        <!-- Coins décoratifs -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Handle de redimensionnement -->
        <div class="resize-handle" id="resizeHandle"></div>

        <!-- Header -->
        <header class="drawer-header">
            <div class="header-left">
                <svg class="header-emblem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                    <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <div class="header-meta">
                    <span class="header-title">Imperial Elegy</span>
                    <span class="header-sub">Rulebook &amp; Card Reference</span>
                </div>
            </div>
            <div class="header-right">
                <a class="hdr-btn" href="#" id="downloadBtn" download aria-label="Télécharger">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                    <span>Télécharger</span>
                </a>
                <a class="hdr-btn" href="#" id="newTabBtn" target="_blank" rel="noopener" aria-label="Nouvel onglet">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                    </svg>
                    <span>Nouvel onglet</span>
                </a>
                <button class="close-btn" id="closeBtn" aria-label="Fermer le volet">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Corps PDF -->
        <div class="drawer-body">
            <div class="pdf-loading" id="pdfLoading">
                <div class="spinner-wrap">
                    <div class="spinner-ring"></div>
                    <div class="spinner-ring"></div>
                </div>
                <span class="loading-label">Chargement du document…</span>
            </div>
            <iframe
                class="pdf-frame"
                id="pdfFrame"
                src=""
                title="Imperial Elegy Rulebook"
            ></iframe>
        </div>

        <!-- Footer -->
        <footer class="drawer-footer">
            <span class="footer-text">Card Manifest</span>
            <div class="footer-divider"></div>
            <div class="footer-pulse">
                <div class="footer-dot"></div>
                <span class="footer-status">PDF Reference</span>
            </div>
        </footer>

    </aside>

    <!-- ═══════════════════════════════════════════
         Card data
    ════════════════════════════════════════════ -->
    <script src="js/cards_event.js"></script>
    <script src="js/cards_gw.js"></script>
    <script src="js/cards_home.js"></script>
    <script src="js/cards_national_goal.js"></script>
    <!-- App logic -->
    <script src="js/app.js"></script>
</body>
</html>
