<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Elegy — Card Manifest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Imperial Elegy</h1>
        <p>Card Manifest — Complete Reference</p>
    </header>

    <div class="controls">
        <div class="search-group">
            <label for="filter-name">Search Title</label>
            <input type="text" id="filter-name" placeholder="Card name...">
        </div>
        <div class="search-group">
            <label for="filter-text">Search Text</label>
            <input type="text" id="filter-text" placeholder="Card text...">
        </div>
        <div class="search-group">
            <label for="filter-type">Type</label>
            <select id="filter-type">
                <option value="">All Types</option>
                <option value="Event" selected>Event (all)</option>
                <option value="Event-mandatory">Event — Mandatory</option>
                <option value="Event-response">Event — Response</option>
                <option value="Event-combat">Event — Combat</option>
                <option value="GW Event">GW Event</option>
                <option value="Home">Home</option>
                <option value="GE Objective">GE Objective</option>
                <option value="UK Objective">UK Objective</option>
                <option value="FR Objective">FR Objective</option>
                <option value="AU Objective">AU Objective</option>
                <option value="RU Objective">RU Objective</option>
                <option value="OT Objective">OT Objective</option>
            </select>
        </div>
        <div class="search-group">
            <label for="per-page">Per Page</label>
            <select id="per-page">
                <option value="25">25</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="999">All</option>
            </select>
        </div>
        <div class="view-toggle">
            <button id="btn-table" class="active" onclick="setView('table')">Table</button>
            <button id="btn-gallery" onclick="setView('gallery')">Gallery</button>
        </div>
    </div>

    <div class="results-info" id="results-info"></div>

    <div class="table-container active" id="table-view">
        <table>
            <thead>
                <tr>
                    <th data-sort="number"># <span class="sort-arrow">▲</span></th>
                    <th data-sort="cp">CP <span class="sort-arrow">▲</span></th>
                    <th data-sort="name">Name <span class="sort-arrow">▲</span></th>
                    <th data-sort="type">Type <span class="sort-arrow">▲</span></th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="gallery-container" id="gallery-view">
        <div class="gallery-grid" id="gallery-grid"></div>
    </div>

    <div class="pagination" id="pagination"></div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <button class="lightbox-nav prev" onclick="navLightbox(-1)">‹</button>
        <button class="lightbox-nav next" onclick="navLightbox(1)">›</button>
        <div class="lightbox-content">
            <img id="lb-img" src="" alt="">
            <div class="lightbox-details">
                <h2 id="lb-name"></h2>
                <div class="detail-row">
                    <div class="detail-label">Type</div>
                    <div class="detail-value" id="lb-type"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Number</div>
                    <div class="detail-value" id="lb-number"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Command Points</div>
                    <div class="detail-value" id="lb-cp"></div>
                </div>
                <div class="detail-row" id="lb-spec-row">
                    <div class="detail-label">Card Text</div>
                    <div class="card-text" id="lb-spec"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Card data -->
    <script src="js/cards_event.js"></script>
    <script src="js/cards_gw.js"></script>
    <script src="js/cards_home.js"></script>
    <script src="js/cards_national_goal.js"></script>
    <!-- App logic -->
    <script src="js/app.js"></script>
</body>
</html>
